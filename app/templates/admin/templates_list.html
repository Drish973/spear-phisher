{% extends "base.html" %}
{% block content %}
<h2>Templates</h2>

<a class="btn btn-sm btn-primary mb-3" href="{{ url_for('admin.templates_new') }}">New Template</a>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Category</th>
      <th>Subject</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for t in templates %}
      <tr>
        <td>{{ t.name }}</td>
        <td>{{ t.category }}</td>
        <td>{{ t.subject }}</td>
        <td>
          <a class="btn btn-sm btn-secondary" href="{{ url_for('admin.templates_edit', template_id=t.id) }}">
            Edit
          </a>
        </td>
      </tr>
    {% else %}
      <tr>
        <td colspan="4">No templates yet.</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
