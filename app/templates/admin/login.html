{% extends "base.html" %}
{% block content %}
<h2>Admin Login</h2>
<form method="post">
  <div class="mb-3">
    <label>Email</label>
    <input class="form-control" type="email" name="email">
  </div>
  <div class="mb-3">
    <label>Password</label>
    <input class="form-control" type="password" name="password">
  </div>
  <button class="btn btn-primary">Login</button>
</form>
{% endblock %}
